version: "3.8"

services:
  database:
    image: mysql:8.0
    container_name: teojaba-database
    restart: unless-stopped
    ports:
      - "3303:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - teojaba-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teojaba-backend
    restart: unless-stopped
    ports:
      - "8001:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - database
    networks:
      - teojaba-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teojaba-frontend
    restart: unless-stopped
    ports:
      - "1002:80"
    environment:
      REACT_APP_KAKAO_MAP_API_KEY: ${REACT_APP_KAKAO_MAP_API_KEY}
    depends_on:
      - backend
    networks:
      - teojaba-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: teojaba-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml
      - ~/.cloudflared/52e8b897-cafb-474f-a5b5-710285428aa7.json:/etc/cloudflared/creds.json
    depends_on:
      - frontend
    networks:
      - teojaba-network

networks:
  teojaba-network:
    driver: bridge
